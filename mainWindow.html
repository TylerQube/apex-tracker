<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" type="text/css" href="./styles/apex-styles.css">
        <title>Apex Stat Tracker</title>
    </head>
    <body>
        <div class="menu-bar">
            <div class="flex-bar">
                <div class="div-icon"><img class="icon30" src="images/app_icon_64.png"></div>
                <div>Unofficial Apex Legends Stat Tracker</div>
            </div>
            <div style="-webkit-app-region:no-drag">
                <div id="nav-min" class="nav-menu"><img class="icon20x20" src="images/icon_minimize.png"></div>
                <div id="nav-max" class="nav-menu"><img id="max-img"class="icon20x20" src="images/icon_fullscreen.png"></div>
                <div id="nav-close" class="nav-menu"><img class="icon20x20" src="images/icon_exit.png"></div>
            </div>
        </div>

        <div class="nav-bar">
            <button class="nav-button clicked-nav" id="nav-form"><p>FORM</p></button>
            <button class="nav-button unclicked-nav" id="nav-data"><p>DATA</p></button>
            <button class="nav-button unclicked-nav" id="nav-stats"><p>STATS</p></button>
        </div>
        
        <div id="form-page" class="page-container">
            <div class="page-contents"></div>
                <form id="apex-form-header">
                            <h2>MATCH DATA</h2>
                            <label>LEGEND PLAYED</label>
                            <br/>
                            <!-- LEGEND RADIO BUTTONS -->
                            <div class="centerDiv teko-font" id="legend-container">
                                    <div class="grid-container" >
                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="bloodhound" value="Bloodhound" required>
                                            <label for="bloodhound"> 
                                                <div class='styled-radio' id="bloodhound"></div>
                                            </label>
                                        </div>

                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="gibraltar" value="Gibraltar">
                                            <label for="gibraltar"> 
                                                <div class="styled-radio" id="gibraltar"></div>
                                            </label>
                                        </div>

                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="lifeline" value="Lifeline">
                                            <label for="lifeline"> 
                                                <div class="styled-radio" id="lifeline"></div>
                                            </label>
                                        </div>

                                        <!-- SECOND ROW -->
                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="pathfinder" value="Pathfinder">
                                            <label for="pathfinder"> 
                                                <div class="styled-radio" id="pathfinder"></div>
                                            </label>
                                        </div>

                                        <div class="grid-container"></div>

                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="wraith" value="Wraith">
                                            <label for="wraith"> 
                                                <div class="styled-radio" id="wraith"></div>
                                            </label>
                                        </div>

                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="bangalore" value="Bangalore">
                                            <label for="bangalore"> 
                                                <div class="styled-radio" id="bangalore"></div>
                                            </label>
                                        </div>

                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="caustic" value="Caustic">
                                            <label for="caustic"> 
                                                <div class="styled-radio" id="caustic"></div>
                                            </label>
                                        </div>

                                        <!-- THIRD ROW -->
                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="mirage" value="Mirage">
                                            <label for="mirage"> 
                                                <div class="styled-radio" id="mirage"></div>
                                            </label>
                                        </div>

                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="octane" value="Octane">
                                            <label for="octane"> 
                                                <div class="styled-radio" id="octane"></div>
                                            </label>
                                        </div>

                                        <div class="grid-container"></div>

                                        <div class="grid-item">
                                            <input class="apex-form"  type="radio" name="legend" id="wattson" value="Wattson">
                                            <label for="wattson"> 
                                                <div class="styled-radio" id="wattson"></div>
                                            </label>
                                        </div>

                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="crypto" value="Crypto">
                                            <label for="crypto"> 
                                                <div class="styled-radio" id="crypto"></div>
                                            </label>
                                        </div>

                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="revenant" value="Revenant">
                                            <label for="revenant"> 
                                                <div class="styled-radio" id="revenant"></div>
                                            </label>
                                        </div>

                                        <div class="grid-item">
                                            <input class="apex-form" type="radio" name="legend" id="loba" value="Loba">
                                            <label for="loba"> 
                                                <div class="styled-radio" id="loba"></div>
                                            </label>
                                        </div>
                                    </div>
                            </div>
                        <br/>
                        <label>SEASON:</label>
                        <input class="apex-form" type='number' value="5" id='season-input' min="4" max="5" required><br/>

                        <label>FINAL PLACE:</label>
                        <input class="apex-form" type='number' id="place-input" min="1" max="60" required><br/>

                        <label>KILLS:</label>
                        <input class="apex-form" type='number' id="kills-input" min="0" max="60" required><br/>

                        <label>DAMAGE INFLICTED:</label>
                        <input class="apex-form" type='number' id="damage-input" min="0" required><br/>

                        <label>TIME SURVIVED:</label>
                            <input class="apex-form" type='number' placeholder="MM" id="minutes-input" min="0" max="59" required>
                            <input class="apex-form" type='number' placeholder="SS" id="seconds-input" min="0" max="59" required><br/>

                        <label>REVIVES GIVEN:</label>
                        <input class="apex-form" type='number' id="revives-input" min="0" required><br/>
                        
                        <div class="centerDiv">
                            <input type="submit" id="submit-button" class="apex-form apex-button teko-font"" value="SUBMIT" id="submit"></input>
                            <input type="button" class="apex-button teko-font" onclick="resetForm()" value="RESET" id="reset-button"></input>
                        </div>

                        <p id="message" class="teko-font"></p>
                        <p id="json-display"></p>
                    </fieldset>
                </form>
            </div>
        </div>

        <div id="data-page" class="page-container">
            <div class="page-contents">
                <h2>PLAYER DATA</h3>
                <div>
                    <div id="filter-container">
                        <select name="sort-by" class="apex-select" id="sort-by" onchange="sortByOptions()">
                            <option value="Date">Date</option>
                            <option value="Kills">Kills</option>
                            <option value="Legend">Legend</option>
                            <option value="FinalPlace">Final Place</option>
                            <option value="Damage">Damage</option>
                            <option value="TimeSurvived">Time Survived</option>
                            <option value="Revives">Revives</option>
                        </select>
                        <select name="asc-select" class="apex-select" id="asc-select" onchange="sortByOptions()">
                            <option value="DESC">High to Low</option>
                            <option value="ASC">Low to High</option>
                        </select>
                        <select name="sort-season" class="apex-select" id="sort-season" onchange="sortByOptions()">
                            <option value="All">All Seasons</option>
                            <option value="5">Season 5</option>
                            <option value="4">Season 4</option>
                        </select>
                    </div>
                    
                    <div id="data-display"></div>
                </div>
            </div>
        </div>
        
    <script src="formHandling.js"></script>
    <script src="dbManage.js"></script>
    <script src="navbar.js"></script>
    </body>
</html>
