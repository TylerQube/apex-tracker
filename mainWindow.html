<!DOCTYPE html>
<html>
    <head>
        <link href="https://allfont.net/allfont.css?fonts=agency-fb-bold" rel="stylesheet" type="text/css" />
        <link rel="stylesheet" type="text/css" href="./styles/apex-styles.css">
        <title>Apex Stat Tracker</title>
    </head>
    <body>
            <form class="apex-form form">
                <fieldset>
                    <div>
                        <legend>MATCH DATA</legend>
                        <label>LEGEND PLAYED</label>
                        <br/>
                            <div class="centerDiv teko-font">
                                <div class="grid-container">
                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="bloodhound" value="bloodhound" required>
                                        <label for="bloodhound"> 
                                            <div class='styled-radio' id="bloodhound"></div>
                                        </label>
                                    </div>

                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="gibraltar" value="gibraltar">
                                        <label for="gibraltar"> 
                                            <div class="styled-radio" id="gibraltar"></div>
                                        </label>
                                    </div>

                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="lifeline" value="lifeline">
                                        <label for="lifeline"> 
                                            <div class="styled-radio" id="lifeline"></div>
                                        </label>
                                    </div>

                                    <!-- SECOND ROW -->
                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="pathfinder" value="pathfinder">
                                        <label for="pathfinder"> 
                                            <div class="styled-radio" id="pathfinder"></div>
                                        </label>
                                    </div>

                                    <div class="grid-container"></div>

                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="wraith" value="wraith">
                                        <label for="wraith"> 
                                            <div class="styled-radio" id="wraith"></div>
                                        </label>
                                    </div>

                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="bangalore" value="bangalore">
                                        <label for="bangalore"> 
                                            <div class="styled-radio" id="bangalore"></div>
                                        </label>
                                    </div>

                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="caustic" value="caustic">
                                        <label for="caustic"> 
                                            <div class="styled-radio" id="caustic"></div>
                                        </label>
                                    </div>

                                    <!-- THIRD ROW -->
                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="mirage" value="mirage">
                                        <label for="mirage"> 
                                            <div class="styled-radio" id="mirage"></div>
                                        </label>
                                    </div>

                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="octane" value="octane">
                                        <label for="octane"> 
                                            <div class="styled-radio" id="octane"></div>
                                        </label>
                                    </div>

                                    <div class="grid-container"></div>

                                    <div class="grid-item">
                                        <input class="apex-form"  type="radio" name="legend" id="wattson" value="wattson">
                                        <label for="wattson"> 
                                            <div class="styled-radio" id="wattson"></div>
                                        </label>
                                    </div>

                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="crypto" value="crypto">
                                        <label for="crypto"> 
                                            <div class="styled-radio" id="crypto"></div>
                                        </label>
                                    </div>

                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="revenant" value="revenant">
                                        <label for="revenant"> 
                                            <div class="styled-radio" id="revenant"></div>
                                        </label>
                                    </div>

                                    <div class="grid-item">
                                        <input class="apex-form" type="radio" name="legend" id="loba" value="loba">
                                        <label for="loba"> 
                                            <div class="styled-radio" id="loba"></div>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>
                    <br/>
                    <label>SEASON:</label>
                    <input class="apex-form" type='number' value="5" id='season-input' min="5" max="5" required><br/>

                    <label>FINAL PLACE:</label>
                    <input class="apex-form" type='number' id="place-input" min="1" max="60" required><br/>

                    <label>KILLS:</label>
                    <input class="apex-form" type='number' id="kills-input" min="0" max="60" required><br/>

                    <label>DAMAGE INFLICTED:</label>
                    <input class="apex-form" type='number' id="damage-input" min="0" required><br/>

                    <label>TIME SURVIVED:</label>
                        <input class="apex-form" type='number' placeholder="MM" id="minutes-input" min="0" max="59" required>
                        <input class="apex-form" type='number' placeholder="SS" id="seconds-input" min="0" max="59" required><br/>

                    <label>REVIVES GIVEN:</label>
                    <input class="apex-form" type='number' id="revives-input" min="0" required><br/>
                    
                    <div class="centerDiv">
                        <input type="submit" id="submit-button" class="apex-form apex-button teko-font"" value="SUBMIT" id="submit"></input>
                        <input type="reset" class="apex-button teko-font" value="RESET" id="reset"></input>
                    </div>

                    <p id="message" class="teko-font"></p>
                    <p id="json-display"></p>
                </fieldset>
            </form>
        </div>
        
    <script>
        const electron = require('electron');
        const { dialog } = require('electron').remote;
        const {ipcRenderer} = electron;

        ipcRenderer.on('item:add', function(e, item){
            const li = document.createElement('li');
            const itemText = document.createTextNode(item);
            li.appendChild(itemText);
            ul.appendChild(li);
        });

        //define submit button
        const submitButton = document.getElementById('submit-button');

        //validates form on submit and creates json
        submitButton.addEventListener('click', function(event) {
            //prevents propagation
            event.preventDefault();
            //true if missing required fields
            let incomplete = false;
            const invalidOutline = "4px solid rgba(255, 0, 0, 0.7)";
            //iterate through radio buttons to find selected
            const legendRadios = document.getElementsByName('legend');
            let legendPicked = false;
            let legend;
            for(let i = 0; i < legendRadios.length; i++) {
                if(legendRadios[i].checked) {
                    legendPicked = true;
                    legend = legendRadios[i].value;
                } 
            }
            if(!legendPicked) {
                incomplete = true;
                console.log("no legend selected");
            }
            //check season
            const seasonInput = document.getElementById("season-input");
            let season;
            if(seasonInput.checkValidity()) {
                season = seasonInput.value;
            } else {
                incomplete = true;
                console.log("changing placeholder...");
                seasonInput.style.outline = invalidOutline;
            }
            //check final place
            const placeInput = document.getElementById("place-input");
            let place;
            if(placeInput.checkValidity()) {
                place = placeInput.value;
            } else {
                incomplete = true;
                console.log("final place invalid");
                placeInput.style.outline = invalidOutline;
            }
            //check kills
            const killsInput = document.getElementById("kills-input");
            let kills;
            if(killsInput.checkValidity()) {
                kills = killsInput.value;
            } else {
                incomplete = true;
                console.log("kills invalid");
                killsInput.style.outline = invalidOutline;
            }
            //check damage 
            const damageInput = document.getElementById("damage-input");
            let damage;
            if(damageInput.checkValidity()) {
                damage = damageInput.value;
            } else {
                incomplete = true;
                console.log("damage invalid");
                damageInput.style.outline = invalidOutline;
            }

            //check time survived
            const minInput = document.getElementById("minutes-input");
            const secInput = document.getElementById("seconds-input");
            let timeSurvived;
            if(minInput.checkValidity() && secInput.checkValidity()) {
                let minSurvived = minInput.value;
                let secSurvived = secInput.value;
                if(minInput.value.length == 1) {
                    minSurvived = "0" + minSurvived;
                }
                if(secInput.value.length == 1) {
                    secSurvived = "0" + secSurvived;
                }
                timeSurvived = "00:" + minSurvived + ":" + secSurvived; 
            } 
            if(!minInput.checkValidity()) {
                incomplete = true;
                console.log("minutes invalid");
                minInput.style.outline = invalidOutline;
            } 
            if(!minInput.checkValidity()) {
                incomplete = true;
                console.log("seconds invalid");
                secInput.style.outline = invalidOutline;
            }
            //check revives given
            const revivesInput = document.getElementById("revives-input");
            let revivesGiven;
            if(revivesInput.checkValidity()) {
                revivesGiven = revivesInput.value;
            } else {
                incomplete = true;
                console.log("revives invalid");
                revivesInput.style.outline = invalidOutline;
            }
            //evaluate if form is completed
            if(incomplete) {
                document.getElementById('json-display').style.fontSize = "80%";
                document.getElementById('json-display').innerHTML = "Form Incomplete...";
                return;
            } else {
                console.log("form submitting...");
                //create json to be submitted
                let formData = {
                    "legend":legend,
                    "season":Number(season),
                    "final-place":Number(place),
                    "kills":Number(kills),
                    "damage":Number(damage),
                    "time-survived":timeSurvived,
                    "revives-given":Number(revivesGiven)
                }
                document.getElementById('json-display').innerHTML = JSON.stringify(formData);
                createDB();
                addRow(formData);
            }
            
        });
    </script>
    <script src="dbManage.js"></script>
    </body>
</html>
